name: Build and release

# Every push to main is tested, built and published as a GitHub release.
# The app on the phone looks at the latest release and offers to update
# itself (see lib/updater.dart).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 1.0.<run number>: always higher than the previous release.
      VERSION: 1.0.${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Android installs an update only when it is signed with the same key
      # as the app already on the phone, so releases need the signing key.
      - name: Set up the signing key
        id: signing
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets are not set. Building a test APK only; no release is published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pasted secrets often carry a stray space or line break; drop them.
          keystore=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          password=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')
          if ! printf '%s' "$keystore" | base64 --decode > android/upload-keystore.jks 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 (${#keystore} characters). It must be the base64 text of android/upload-keystore.jks."
            exit 1
          fi
          if ! PW="$password" keytool -list -keystore android/upload-keystore.jks -storepass:env PW -alias upload > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened: KEYSTORE_BASE64 decodes to $(stat -c %s android/upload-keystore.jks) bytes and KEYSTORE_PASSWORD has ${#password} characters. One of the two secrets is wrong."
            exit 1
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' \
            "$password" "$password" > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release --build-name="$VERSION" --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk annual-leave.apk

      - uses: actions/upload-artifact@v7
        with:
          name: annual-leave-apk
          path: annual-leave.apk

      - name: Publish release
        if: steps.signing.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" annual-leave.apk \
            --title "Annual Leave $VERSION" \
            --generate-notes \
            --latest
